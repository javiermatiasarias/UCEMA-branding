<!DOCTYPE html><html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:'Barlow',sans-serif}</style>
</head>
<body style="background:#f6f5f4;padding:20px 28px;display:flex;gap:20px;align-items:flex-start;">

  <!-- Large -->
  <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
    <img src="../assets/logo.svg" width="100" height="100" alt="UCEMA logo">
    <div style="font-size:9px;color:#888;letter-spacing:1px;">LG · 160px</div>
  </div>

  <!-- Medium -->
  <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
    <img src="../assets/logo.svg" width="72" height="72" alt="UCEMA logo">
    <div style="font-size:9px;color:#888;letter-spacing:1px;">MD · 120px</div>
  </div>

  <!-- Small -->
  <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
    <img src="../assets/logo.svg" width="52" height="52" alt="UCEMA logo">
    <div style="font-size:9px;color:#888;letter-spacing:1px;">SM · 90px</div>
  </div>

  <div style="width:1px;background:#ddd;height:120px;margin:0 8px;"></div>

  <!-- On dark -->
  <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
    <div style="background:#0D1218;padding:12px;display:flex;align-items:center;justify-content:center;">
      <img src="../assets/logo.svg" width="72" height="72" alt="UCEMA logo">
    </div>
    <div style="font-size:9px;color:#888;letter-spacing:1px;">On Dark</div>
  </div>

  <!-- On white -->
  <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
    <div style="background:#fff;border:1px solid #eee;padding:12px;display:flex;align-items:center;justify-content:center;">
      <img src="../assets/logo.svg" width="72" height="72" alt="UCEMA logo">
    </div>
    <div style="font-size:9px;color:#888;letter-spacing:1px;">On White</div>
  </div>

  <div style="flex:1;padding-left:8px;">
    <div style="font-size:11px;font-weight:600;color:#3E3C3B;margin-bottom:6px;">Reglas de uso</div>
    <div style="font-size:10px;color:#7A7876;line-height:1.6;">
      ✓ Siempre sobre fondo carmesí #940028<br>
      ✓ Respetar clearspace mínimo = ½ lado del logo<br>
      ✗ No usar sobre fotografías sin block carmesí<br>
      ✗ No cambiar color, proporción ni tipografía<br>
      ✗ No rotar ni aplicar efectos
    </div>
  </div>
</body></html>
