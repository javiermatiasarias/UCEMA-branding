<!-- @dsCard group="Slides" viewport="1280x720" name="03 — Content (White)" subtitle="Slide de contenido estándar: fondo blanco, sidebar gris, logo arriba derecha" -->
<!DOCTYPE html><html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1280px;height:720px;overflow:hidden;}
</style>
</head>
<body>
  <div style="width:1280px;height:720px;display:flex;background:#fff;">

    <!-- Main content area -->
    <div style="flex:1;min-width:0;display:flex;flex-direction:column;padding:60px 64px 56px 80px;">

      <!-- Title block -->
      <div style="margin-bottom:36px;">
        <div style="font-family:'Barlow',sans-serif;font-weight:600;font-size:13px;color:#940028;letter-spacing:3px;text-transform:uppercase;margin-bottom:12px;">Tema · Subtema</div>
        <div style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:52px;color:#131211;line-height:1.0;letter-spacing:-0.01em;">Título del Slide</div>
        <div style="width:48px;height:3px;background:#940028;margin-top:14px;"></div>
      </div>

      <!-- Content bullets -->
      <div style="flex:1;display:flex;flex-direction:column;gap:18px;justify-content:center;">
        <div style="display:flex;gap:16px;align-items:flex-start;">
          <div style="width:6px;height:6px;background:#940028;flex-shrink:0;margin-top:10px;"></div>
          <div style="font-family:'Barlow',sans-serif;font-weight:600;font-size:24px;color:#131211;line-height:1.35;">Punto principal con idea clave del slide</div>
        </div>
        <div style="display:flex;gap:16px;align-items:flex-start;">
          <div style="width:6px;height:6px;background:#940028;flex-shrink:0;margin-top:10px;"></div>
          <div style="font-family:'Barlow',sans-serif;font-weight:600;font-size:24px;color:#131211;line-height:1.35;">Segundo punto con evidencia o dato relevante</div>
        </div>
        <div style="display:flex;gap:16px;align-items:flex-start;padding-left:22px;">
          <div style="width:4px;height:4px;border:1px solid #940028;flex-shrink:0;margin-top:12px;"></div>
          <div style="font-family:'Barlow',sans-serif;font-weight:400;font-size:20px;color:#5A5856;line-height:1.4;">Sub-punto o detalle de soporte</div>
        </div>
        <div style="display:flex;gap:16px;align-items:flex-start;">
          <div style="width:6px;height:6px;background:#940028;flex-shrink:0;margin-top:10px;"></div>
          <div style="font-family:'Barlow',sans-serif;font-weight:600;font-size:24px;color:#131211;line-height:1.35;">Tercer punto con implicancia o conclusión parcial</div>
        </div>
      </div>

      <!-- Footer note -->
      <div style="font-family:'Barlow',sans-serif;font-weight:300;font-size:14px;color:#C0BDBB;">Fuente: Autor, Año · Material de uso exclusivo académico</div>
    </div>

    <!-- Gray sidebar with logo -->
    <div style="width:200px;flex-shrink:0;background:#ECEAE9;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:36px;">
      <img src="../assets/logo.svg" width="132" height="132" alt="UCEMA" style="display:block;">
    </div>

  </div>
</body></html>
