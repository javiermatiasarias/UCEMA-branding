<!-- @dsCard group="Brand" viewport="700x130" name="Elementos de acento" subtitle="Línea carmesí de 3px, watermark, sidebar gris — los tres recursos estructurales del sistema" -->
<!DOCTYPE html><html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&family=Barlow+Condensed:wght@800&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}</style>
</head>
<body style="background:#f6f5f4;padding:16px 28px;display:flex;gap:16px;">

  <!-- Accent line demo -->
  <div style="background:#fff;border:1px solid #eee;padding:14px 16px;flex:1;min-width:0;">
    <div style="width:100%;height:3px;background:#940028;margin-bottom:10px;"></div>
    <div style="font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:18px;color:#131211;">Título de sección</div>
    <div style="font-size:10px;color:#aaa;margin-top:4px;font-family:sans-serif;">Línea carmesí 3px — separador de título</div>
  </div>

  <!-- Sidebar demo -->
  <div style="background:#fff;border:1px solid #eee;flex:1;min-width:0;display:flex;overflow:hidden;">
    <div style="flex:1;padding:14px 12px;">
      <div style="width:36px;height:3px;background:#940028;margin-bottom:8px;"></div>
      <div style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:15px;color:#131211;">Contenido</div>
      <div style="font-size:9px;color:#888;margin-top:4px;font-family:sans-serif;">Área principal del slide</div>
    </div>
    <div style="width:28%;background:#ECEAE9;padding:10px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:6px;">
      <img src="../assets/logo.svg" width="44" height="44" alt="logo">
      <div style="font-size:8px;color:#999;text-align:center;font-family:sans-serif;">Sidebar gris</div>
    </div>
  </div>

  <!-- Watermark demo -->
  <div style="background:#940028;flex:1;min-width:0;padding:14px 16px;position:relative;overflow:hidden;">
    <div style="position:absolute;right:-10px;bottom:-20px;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:80px;color:rgba(0,0,0,0.15);line-height:1;user-select:none;">U</div>
    <div style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:15px;color:#fff;position:relative;">Watermark</div>
    <div style="font-size:9px;color:rgba(255,255,255,0.5);margin-top:4px;position:relative;font-family:sans-serif;">Letterform "U" de fondo</div>
  </div>

</body></html>
