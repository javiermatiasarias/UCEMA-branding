<!DOCTYPE html><html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@300;400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1280px;height:720px;overflow:hidden;}
</style>
</head>
<body>
  <div style="position:relative;width:1280px;height:720px;background:#940028;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 160px;overflow:hidden;">

    <!-- Watermark arcs -->
    <div style="position:absolute;right:-120px;top:-120px;width:600px;height:600px;border-radius:50%;border:80px solid rgba(0,0,0,0.08);pointer-events:none;"></div>
    <div style="position:absolute;left:-80px;bottom:-80px;width:400px;height:400px;border-radius:50%;border:60px solid rgba(0,0,0,0.06);pointer-events:none;"></div>

    <!-- Opening quote mark -->
    <div style="position:absolute;top:48px;left:96px;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:180px;color:rgba(0,0,0,0.12);line-height:1;">"</div>

    <!-- Quote text -->
    <div style="position:relative;text-align:center;max-width:960px;">
      <div style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:60px;color:#fff;line-height:1.1;letter-spacing:-0.01em;text-wrap:balance;margin-bottom:32px;">"La innovación distingue a un líder de un seguidor"</div>
      <div style="width:56px;height:2px;background:rgba(255,255,255,0.3);margin:0 auto 24px;"></div>
      <div style="font-family:'Barlow',sans-serif;font-weight:300;font-size:20px;color:rgba(255,255,255,0.6);letter-spacing:1px;">— Autor o fuente de la cita · Año</div>
    </div>

    <!-- Logo bottom-right -->
    <div style="position:absolute;bottom:40px;right:56px;">
      <img src="../assets/logo.svg" width="88" height="88" alt="UCEMA" style="display:block;">
    </div>

    <!-- Bottom line -->
    <div style="position:absolute;bottom:0;left:0;right:0;height:3px;background:rgba(0,0,0,0.2);"></div>
  </div>
</body></html>
