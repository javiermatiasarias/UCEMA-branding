<!-- @dsCard group="Slides" viewport="1280x720" name="08 — Closing" subtitle="Cierre de presentación: fondo blanco, título carmesí, logo abajo derecha" -->
<!DOCTYPE html><html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1280px;height:720px;overflow:hidden;}
</style>
</head>
<body>
  <div style="position:relative;width:1280px;height:720px;background:#fff;overflow:hidden;">

    <!-- Subtle crimson accent bar left -->
    <div style="position:absolute;left:0;top:0;bottom:0;width:6px;background:#940028;"></div>

    <!-- Content -->
    <div style="position:absolute;top:50%;left:80px;transform:translateY(-50%);">
      <div style="font-family:'Barlow',sans-serif;font-weight:500;font-size:13px;color:#C0BDBB;letter-spacing:3px;text-transform:uppercase;margin-bottom:20px;">MBA · UCEMA</div>
      <div style="font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:100px;color:#940028;line-height:0.95;letter-spacing:-0.02em;">¡Muchas<br>gracias!</div>
      <div style="width:64px;height:3px;background:#940028;margin-top:24px;margin-bottom:28px;"></div>
      <div style="font-family:'Barlow',sans-serif;font-weight:400;font-size:22px;color:#5A5856;line-height:1.5;max-width:600px;">Nombre del docente<br>curso@ucema.edu.ar</div>
    </div>

    <!-- Logo block bottom-right — exactly as original template -->
    <div style="position:absolute;bottom:48px;right:56px;">
      <img src="../assets/logo.svg" width="148" height="148" alt="UCEMA" style="display:block;">
    </div>

    <!-- Top crimson line -->
    <div style="position:absolute;top:0;left:0;right:0;height:3px;background:#940028;"></div>
  </div>
</body></html>
