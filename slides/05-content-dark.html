<!-- @startingPoint section="Slides" subtitle="Slide tecnología / datos — fondo oscuro" viewport="1280x720" -->
<!-- @dsCard group="Slides" viewport="1280x720" name="05 — Content (Dark / Tech)" subtitle="Fondo oscuro para slides de tecnología, datos, ciencia e innovación" -->
<!DOCTYPE html><html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@300;400;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1280px;height:720px;overflow:hidden;}
</style>
</head>
<body>
  <div style="position:relative;width:1280px;height:720px;background:#0D1218;overflow:hidden;display:flex;flex-direction:column;justify-content:center;padding:72px 80px 72px 96px;">

    <!-- Subtle grid lines -->
    <div style="position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,0.02) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.02) 1px,transparent 1px);background-size:80px 80px;pointer-events:none;"></div>

    <!-- Crimson glow accent -->
    <div style="position:absolute;left:-100px;bottom:-100px;width:500px;height:500px;background:radial-gradient(circle,rgba(148,0,40,0.2) 0%,transparent 70%);pointer-events:none;"></div>

    <!-- Logo top-right -->
    <div style="position:absolute;top:40px;right:56px;">
      <img src="../assets/logo.svg" width="96" height="96" alt="UCEMA" style="display:block;">
    </div>

    <!-- Label -->
    <div style="font-family:'Barlow',sans-serif;font-weight:400;font-size:12px;color:#940028;letter-spacing:4px;text-transform:uppercase;margin-bottom:18px;position:relative;">Tecnología · Datos · Innovación</div>

    <!-- Title -->
    <div style="font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:60px;color:#fff;line-height:1.0;letter-spacing:-0.01em;margin-bottom:16px;position:relative;max-width:900px;text-wrap:balance;">Título del Slide Tecnológico</div>
    <div style="width:56px;height:3px;background:#940028;margin-bottom:32px;position:relative;"></div>

    <!-- Content grid — 2 stat blocks + bullets -->
    <div style="display:flex;gap:40px;position:relative;align-items:flex-start;">
      <!-- Stat cards -->
      <div style="display:flex;flex-direction:column;gap:16px;min-width:220px;">
        <div style="background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);padding:16px 20px;">
          <div style="font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:44px;color:#940028;line-height:1;">87%</div>
          <div style="font-family:'Barlow',sans-serif;font-weight:400;font-size:14px;color:rgba(255,255,255,0.5);margin-top:4px;">Dato o métrica relevante</div>
        </div>
        <div style="background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);padding:16px 20px;">
          <div style="font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:44px;color:rgba(255,255,255,0.85);line-height:1;">2.4×</div>
          <div style="font-family:'Barlow',sans-serif;font-weight:400;font-size:14px;color:rgba(255,255,255,0.5);margin-top:4px;">Segunda métrica de impacto</div>
        </div>
      </div>
      <!-- Bullets -->
      <div style="flex:1;display:flex;flex-direction:column;gap:16px;">
        <div style="display:flex;gap:14px;align-items:flex-start;">
          <div style="width:5px;height:5px;background:#940028;flex-shrink:0;margin-top:10px;"></div>
          <div style="font-family:'Barlow',sans-serif;font-weight:600;font-size:22px;color:#fff;line-height:1.35;">Punto clave con evidencia cuantitativa</div>
        </div>
        <div style="display:flex;gap:14px;align-items:flex-start;">
          <div style="width:5px;height:5px;background:#940028;flex-shrink:0;margin-top:10px;"></div>
          <div style="font-family:'Barlow',sans-serif;font-weight:600;font-size:22px;color:#fff;line-height:1.35;">Implicación estratégica o tecnológica</div>
        </div>
        <div style="display:flex;gap:14px;align-items:flex-start;">
          <div style="width:5px;height:5px;background:#940028;flex-shrink:0;margin-top:10px;"></div>
          <div style="font-family:'Barlow',sans-serif;font-weight:600;font-size:22px;color:rgba(255,255,255,0.75);line-height:1.35;">Tendencia o proyección relevante para el análisis</div>
        </div>
      </div>
    </div>

    <!-- Bottom crimson line -->
    <div style="position:absolute;bottom:0;left:0;right:0;height:3px;background:#940028;"></div>
  </div>
</body></html>
