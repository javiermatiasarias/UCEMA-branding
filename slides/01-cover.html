<!-- @dsCard group="Slides" viewport="1280x720" name="01 — Cover" subtitle="Portada principal: fondo oscuro carmesí, arcos geométricos, logo izquierda" -->
<!DOCTYPE html><html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1280px;height:720px;overflow:hidden;background:#0A0008;}
</style>
</head>
<body>
  <div style="position:relative;width:1280px;height:720px;background:#0A0008;overflow:hidden;">

    <!-- Circular arc motifs (from original template) -->
    <div style="position:absolute;left:-60px;bottom:-80px;width:520px;height:520px;border-radius:50%;border:90px solid rgba(148,0,40,0.18);pointer-events:none;"></div>
    <div style="position:absolute;left:80px;bottom:-160px;width:420px;height:420px;border-radius:50%;border:70px solid rgba(148,0,40,0.12);pointer-events:none;"></div>
    <div style="position:absolute;right:120px;top:-100px;width:600px;height:600px;border-radius:50%;border:100px solid rgba(148,0,40,0.08);pointer-events:none;"></div>
    <!-- Subtle crimson radial glow right side -->
    <div style="position:absolute;right:0;top:0;width:720px;height:720px;background:radial-gradient(ellipse at 80% 40%, rgba(148,0,40,0.55) 0%, transparent 70%);pointer-events:none;"></div>

    <!-- Logo block — bottom left, exactly as original -->
    <div style="position:absolute;left:60px;top:50%;transform:translateY(-50%);">
      <img src="../assets/logo.svg" width="188" height="188" alt="UCEMA" style="display:block;">
    </div>

    <!-- Content area — right side -->
    <div style="position:absolute;left:310px;top:50%;transform:translateY(-50%);max-width:860px;padding-right:80px;">
      <div style="font-family:'Barlow',sans-serif;font-weight:400;font-size:14px;color:rgba(255,255,255,0.5);letter-spacing:3px;text-transform:uppercase;margin-bottom:20px;">MBA · UCEMA</div>
      <div style="font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:76px;color:#fff;line-height:1.0;letter-spacing:-0.01em;text-wrap:balance;margin-bottom:16px;">Título del Curso<br>o Presentación</div>
      <div style="width:56px;height:3px;background:#940028;margin-bottom:20px;"></div>
      <div style="font-family:'Barlow',sans-serif;font-weight:300;font-size:24px;color:rgba(255,255,255,0.7);line-height:1.4;">Subtítulo o nombre del módulo · Año lectivo</div>
    </div>

    <!-- Bottom bar -->
    <div style="position:absolute;bottom:0;left:0;right:0;height:3px;background:#940028;"></div>
  </div>
</body></html>
